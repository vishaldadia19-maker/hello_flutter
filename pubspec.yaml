name: hello_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.2.2+130

environment:
  sdk: ">=3.10.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  android_intent_plus: ^6.0.0
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  phone_state: ^3.0.1
  permission_handler: ^12.0.1  
  change_app_package_name: ^1.5.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^21.0.0
  file_picker: ^8.0.0
  android_alarm_manager_plus: ^4.0.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# 👇 MUST BE AT ROOT LEVEL
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
